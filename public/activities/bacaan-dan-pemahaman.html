const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function slugify(s){return s.toLowerCase().replace(/\s+/g,"-")}
function syllables(word){const clean=word.replace(/[^A-Za-zÀ-ÿ]/g,"");if(!clean)return[word];const nuclei=[...clean.matchAll(/[aeiouy]+/gi)];if(nuclei.length<2)return[word];const pieces=[];let start=0;for(let i=0;i<nuclei.length-1;i++){const end=nuclei[i].index+nuclei[i][0].length;const next=nuclei[i+1].index;let between=clean.slice(end,next);if(between.length>1&&/^(ng|ny|sy|kh|gh|sh)$/i.test(between))between="";const boundary=end+(between.length>1?between.length-1:0);if(boundary>start)pieces.push(clean.slice(start,boundary));start=boundary}pieces.push(clean.slice(start));if(pieces.some(part=>!part))return[word];let offset=0;return pieces.map(piece=>{const result=word.slice(offset,offset+piece.length);offset+=piece.length;return result}).concat(offset<word.length?[word.slice(offset)]:[])}
function coloredWord(word){const parts=syllables(word);if(parts.length===1)return `<span class="syllable red">${esc(word)}</span>`;return parts.map((part,i)=>`<span class="syllable ${i%2===0?"red":"black"}">${esc(part)}</span>`).join("")}
function passageHtml(lesson){return lesson.lines.map(line=>`<span class="sentence">${line.split(/(\s+)/).map(part=>/^\s+$/.test(part)?part:coloredWord(part)).join("")}</span>`).join("")}
function updateHeader(){const l=lessons[lessonIndex];const jump=$("passageJump");if(jump.options.length!==lessons.length){jump.innerHTML="";lessons.forEach((lesson,index)=>{const option=document.createElement("option");option.value=String(index);option.textContent=`Petikan ${index+1} · ${lesson.title}`;jump.append(option)})}jump.value=String(lessonIndex);jump.disabled=step==="done";$("topCount").textContent=step==="done"?"Latihan selesai":`Petikan ${lessonIndex+1} daripada ${lessons.length}`;$("activityName").textContent=l?.title||"Selesai";$("progressFill").style.width=`${(step==="done"?100:(lessonIndex+(step==="quiz"?.5:0))/lessons.length*100)}%`;$("stageLabel").textContent=step==="read"?"Langkah 1 · Baca petikan":step==="quiz"?"Langkah 2 · Jawab soalan":"Selesai";$("introText").textContent=step==="read"?"Baca petikan dengan teliti. Kemudian jawab soalan dengan merujuk semula kepada petikan.":step==="quiz"?"Pilih jawapan yang betul. Rujuk petikan di sebelah jika perlu.":"Semua petikan dan soalan telah diselesaikan."}
function render(){updateHeader();$("readStage").classList.toggle("hidden",step!=="read");$("quizStage").classList.toggle("hidden",step!=="quiz");$("doneStage").classList.toggle("hidden",step!=="done");if(step==="read")renderRead();if(step==="quiz")renderQuiz();if(step==="done")renderDone()}
function renderRead(){const l=lessons[lessonIndex];const art=imageData[slugify(l.title)]||"";$("readStage").innerHTML=`<div class="stage-kicker"><span>Petikan ${lessonIndex+1}</span><span>Baca dengan suara yang jelas</span></div><div class="read-visual"><img class="passage-art" src="${art}" alt="Ilustrasi ${esc(l.title)}"></div><h2 class="passage-title">${esc(l.title)}</h2><div class="passage-copy">${passageHtml(l)}</div><div class="read-actions"><span class="hint">${l.lines.length} ayat pendek</span><button class="primary" id="startQuiz">Saya sudah baca <span aria-hidden="true">→</span></button></div>`;$("startQuiz").addEventListener("click",()=>{step="quiz";render()})}
function renderQuiz(){const l=lessons[lessonIndex];let correct=0;const art=imageData[slugify(l.title)]||"";$("quizStage").innerHTML=`<div class="quiz-grid"><section class="passage-panel"><p class="panel-label">Petikan ${lessonIndex+1}</p><h2 class="panel-title">${esc(l.title)}</h2><img class="quiz-art" src="${art}" alt="Ilustrasi ${esc(l.title)}"><div class="quiz-passage">${passageHtml(l,true)}</div></section><section class="question-panel"><p class="panel-label">Soalan pemahaman</p><ol class="question-list">${l.questions.map((item,i)=>{const selected=answers[i];const isCorrect=selected===item.a;if(isCorrect)correct++;return `<li class="question-item"><div class="question-text">${i+1}. ${esc(item.q)}</div><button class="answer-trigger ${selected?`answered ${isCorrect?"correct":"incorrect"}`:""}" data-open="${i}" aria-expanded="${!!revealed[i]}" ${isCorrect?"disabled":""}>${selected?esc(selected):"Pilih jawapan"}</button><div class="choice-menu ${revealed[i]&&(!selected||!isCorrect)?"":"hidden"}" id="choices-${i}">${item.c.map(choice=>`<button class="choice" data-question="${i}" data-choice="${esc(choice)}">${esc(choice)}</button>`).join("")}</div><p class="feedback ${selected?(isCorrect?"good":"try"):""}">${selected?(isCorrect?"Betul! Bagus.":"Belum tepat. Cuba pilihan lain."):""}</p></li>`}).join("")}</ol><div class="quiz-footer"><span class="score-note">${correct} daripada ${l.questions.length} betul</span><button class="primary" id="nextLesson" ${Object.keys(answers).length<l.questions.length?"disabled":""}>${lessonIndex===lessons.length-1?"Tamat latihan":"Petikan seterusnya"} <span aria-hidden="true">→</span></button></div></section></div>`;
$("quizStage").querySelectorAll("[data-open]").forEach(btn=>btn.addEventListener("click",()=>{const i=Number(btn.dataset.open);revealed[i]=!revealed[i];$("choices-"+i).classList.toggle("hidden",!revealed[i]);btn.setAttribute("aria-expanded",String(revealed[i]))}));
$("quizStage").querySelectorAll("[data-choice]").forEach(btn=>btn.addEventListener("click",()=>{const i=Number(btn.dataset.question);answers[i]=btn.dataset.choice;revealed[i]=false;renderQuiz()}));
$("nextLesson").addEventListener("click",()=>{if(Object.keys(answers).length<l.questions.length)return;if(lessonIndex<lessons.length-1){lessonIndex++;step="read";answers={};revealed={}}else{step="done"}render()})}
function renderDone(){const answered=lessons.reduce((n,l)=>n+l.questions.length,0);$("doneStage").innerHTML=`<div class="done-icon" aria-hidden="true">✓</div><h2>Syabas, latihan selesai!</h2><p>Kamu telah membaca ${lessons.length} petikan dan menjawab ${answered} soalan.</p><button class="primary" id="restart">Mula semula <span aria-hidden="true">↻</span></button>`;$("restart").addEventListener("click",()=>{lessonIndex=0;step="read";answers={};revealed={};render()})}
$("passageJump").addEventListener("change",event=>{lessonIndex=Number(event.target.value);step="read";answers={};revealed={};render();window.scrollTo({top:0,behavior:"smooth"})});
render();
</script>
</body>
</html>
